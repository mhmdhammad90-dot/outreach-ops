<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="عمليات Outreach: متابعة زيارات فرق الصحة والتغذية إلى المخيمات ومراكز الإيواء.">
<title>عمليات Outreach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: field-ops console. Right rail (RTL) of sections, a working surface of tables and status chips; teal ink accent, clinic colours as identity chips. */
:root{
  /* Project HOPE palette — Navy 001280 · Blue 005EB8 · Teal 00A5B3 · Yellow F6B80F · Red D40E3E · Black / White */
  --navy:#001280; --blue:#005EB8; --teal:#00A5B3; --yellow:#F6B80F; --red:#D40E3E;
  --bg:#f5f6fa; --surface:#ffffff; --sunk:#eef0f6; --line:#dde1ec;
  --ink:#000000; --muted:#555b6e; --accent:#001280; --accent-ink:#ffffff; --accent-soft:#e3e7f7;
  --ok:#001280; --ok-soft:#e3e7f7; --warn:#000000; --warn-soft:#fdeab6; --bad:#D40E3E; --bad-soft:#fbe1e8; --info:#005EB8; --info-soft:#e0edf9;
  --live:#00808b; --live-soft:#dcf3f5;
  --rail:#001280; --rail-ink:#d6dcf5; --rail-active:#005EB8; --rail-mark:#00A5B3;
  --c1:#005EB8; --c2:#D40E3E; --c3:#2b8c4e; --c4:#e8890c; --c5:#7b4cc2; --c6:#d14b8f; --c7:#00A5B3;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#050a24; --surface:#0b1336; --sunk:#111b45; --line:#1f2a5c;
  --ink:#ffffff; --muted:#a3abc9; --accent:#6cb0f0; --accent-ink:#000a4d; --accent-soft:#132463;
  --ok:#8fb4ff; --ok-soft:#14215c; --warn:#F6B80F; --warn-soft:#3a2d06; --bad:#ff5c80; --bad-soft:#3d0a1b; --info:#6cb0f0; --info-soft:#0d2a52;
  --live:#2fc6d2; --live-soft:#06343a;
  --rail:#000a4d; --rail-ink:#c4cbea; --rail-active:#005EB8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#050a24; --surface:#0b1336; --sunk:#111b45; --line:#1f2a5c;
  --ink:#ffffff; --muted:#a3abc9; --accent:#6cb0f0; --accent-ink:#000a4d; --accent-soft:#132463;
  --ok:#8fb4ff; --ok-soft:#14215c; --warn:#F6B80F; --warn-soft:#3a2d06; --bad:#ff5c80; --bad-soft:#3d0a1b; --info:#6cb0f0; --info-soft:#0d2a52;
  --live:#2fc6d2; --live-soft:#06343a;
  --rail:#000a4d; --rail-ink:#c4cbea; --rail-active:#005EB8; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.6;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.3}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:12.5px;direction:ltr;unicode-bidi:isolate}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
/* rail */
.rail{background:var(--rail);color:var(--rail-ink);padding-block:20px;padding-inline:14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding-inline:6px}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:15px;color:#fff;display:block;line-height:1.2}
.brand small{font-size:11.5px;opacity:.75}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:8px;color:inherit;text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.05)}
.nav a[aria-current="page"]{background:var(--rail-active);color:#fff}
.nav a:focus-visible{outline:2px solid var(--rail-mark);outline-offset:1px}
.nav .count{font-size:11.5px;background:rgba(255,255,255,.1);border-radius:999px;padding:0 8px;font-variant-numeric:tabular-nums}
.live{margin-top:auto;font-size:12px;display:flex;gap:8px;align-items:center;padding-inline:6px;opacity:.85}
.dot{width:8px;height:8px;border-radius:50%;background:var(--teal);flex:none}
.dot.off{background:var(--yellow)}
/* main */
main{min-width:0;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.topbar .title h1{font-size:22px}
.topbar .title p{margin:2px 0 0;color:var(--muted);font-size:13px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{position:relative}
.search input{width:240px;max-width:100%;padding:8px 34px 8px 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px}
.search svg{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.today{font-size:12.5px;color:var(--muted);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.localbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.banner{border:1px solid var(--warn-soft);background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px}
/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:15.5px}
.panel-h p{margin:0;color:var(--muted);font-size:12.5px}
.panel-b{padding:14px 16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi span{color:var(--muted);font-size:12.5px}
.kpi b{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi small{font-size:11.5px;color:var(--muted)}
.kpi.alert{box-shadow:inset 0 -3px 0 var(--yellow)}
.kpi.good b{color:var(--live)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select,.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
.filters .meta{margin-inline-start:auto;color:var(--muted);font-size:12.5px}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:500}
.grid2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
/* table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-weight:500;color:var(--muted);font-size:12px;text-align:right;padding:9px 12px;background:var(--sunk);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
td .sub{display:block;color:var(--muted);font-size:12px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:500;margin-bottom:4px}
/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--sunk);color:var(--ink)}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.s-Planned{background:var(--sunk);color:var(--muted)}
.s-Ready{background:var(--info-soft);color:var(--info)}
.s-Departed,.s-OnSite,.s-Returning{background:var(--live-soft);color:var(--live)}
.s-Completed{background:var(--ok-soft);color:var(--ok)}
.s-Delayed{background:var(--warn-soft);color:var(--warn)}
.s-OnHold{background:var(--bad-soft);color:var(--bad)}
.clin{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.clin::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--cc)}
select.status{padding:4px 8px;font-size:12.5px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
/* alerts */
.alerts{display:flex;flex-direction:column}
.alert{display:flex;gap:10px;padding:10px 16px;border-top:1px solid var(--line);align-items:flex-start}
.alert:first-child{border-top:0}
.alert .bar{width:3px;align-self:stretch;border-radius:2px;background:var(--yellow);flex:none}
.alert.bad .bar{background:var(--bad)}
.alert p{margin:0;font-size:13px}
.alert small{color:var(--muted)}
.okline{margin:14px 16px;padding:10px 12px;border-radius:8px;background:var(--ok-soft);color:var(--ok);font-size:13px}
/* clinic rows */
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 16px;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow .meta{color:var(--muted);font-size:12px}
.meter{grid-column:1/-1;height:5px;background:var(--sunk);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--cc)}
/* week */
.week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:200px}
.day.is-today{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.day-h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.day-h b{font-family:var(--f-display)}
.day-h span{font-size:12px;color:var(--muted)}
.day-b{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1}
.op-card{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);cursor:pointer;text-align:right;display:flex;flex-direction:column;gap:3px;font-size:12.5px;border-inline-start:3px solid var(--cc)}
.op-card:hover{border-color:var(--muted);border-inline-start-color:var(--cc)}
.day .none{color:var(--muted);font-size:12px;text-align:center;margin:auto 0}
/* cards grid */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;border-top:3px solid var(--cc)}
.card h3{font-size:15px}
.card .en{color:var(--muted);font-size:12px;direction:ltr;text-align:right}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.trio div{background:var(--sunk);border-radius:8px;padding:6px}
.trio b{display:block;font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.trio span{font-size:11.5px;color:var(--muted)}
dl.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;margin:0;font-size:13px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0}
/* map */
.map svg{width:100%;height:auto;display:block}
.map .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);padding:0 16px 14px}
/* bars */
.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:120px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:13px}
.barrow .track{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.barrow .track i{display:block;height:100%;background:var(--cc,var(--accent));border-radius:5px}
.barrow .v{text-align:left;font-variant-numeric:tabular-nums;color:var(--muted)}
/* staff form */
.quick{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr)) auto;gap:8px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-weight:600;flex:none}
.person{display:flex;gap:10px;align-items:center}
.person b{font-weight:600}
/* dialog */
dialog{border:0;border-radius:14px;padding:0;width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 32px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,20,20,.45)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-h h2{font-size:17px}
.dlg-b{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dlg-b .full{grid-column:1/-1}
.dlg-f{display:flex;gap:8px;justify-content:space-between;padding:14px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.team{border:1px solid var(--line);border-radius:8px;max-height:200px;overflow:auto}
.trow{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);font-size:13px}
.trow:first-child{border-top:0}
.trow.on{background:var(--sunk)}
.trow.lead{background:var(--accent-soft)}
.tpick{display:flex;gap:8px;align-items:center;padding:7px 10px;cursor:pointer;flex:1;min-width:0}
.tpick .tag{font-size:11px;color:var(--muted)}
.lpick{display:flex;gap:5px;align-items:center;padding:4px 10px;margin-inline-end:6px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-size:12px;font-weight:500;white-space:nowrap}
.trow.lead .lpick{border-color:var(--accent);color:var(--accent)}
.fpi{flex:none;color:var(--live)}
.fp{display:inline-flex;vertical-align:-2px}
.leadbar{margin-top:8px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.leadbar.need{border-style:dashed;border-color:var(--yellow);background:var(--warn-soft);color:var(--warn);font-size:13px}
.leadbar .who{display:flex;gap:10px;align-items:center}
.leadbar .who small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
.leadbar .who b{display:block;font-family:var(--f-display);font-size:15px;line-height:1.3}
.leadbar .ph{display:flex;flex-direction:column;gap:3px;min-width:0}
.leadbar .ph label{font-size:11.5px;color:var(--muted)}
.phrow{display:flex;gap:6px}
.phrow input{width:150px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-family:var(--f-mono);font-size:14px}
.leadbar .hint{font-size:11.5px;color:var(--muted);max-width:260px}
.exp{padding:16px 18px;background:var(--sunk)}
.exp-prev{display:grid;place-items:center;min-height:200px}
.exp-prev img{display:block;max-height:60vh;width:auto;max-width:100%;border-radius:6px;box-shadow:0 6px 24px rgba(0,10,60,.18)}
.inline-add{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) auto;gap:6px;margin-top:8px}
.inline-add input,.inline-add select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;min-width:0;font-size:13px}
.report{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;background:var(--ok-soft);border-radius:10px;padding:12px}
.report .ttl{grid-column:1/-1;font-family:var(--f-display);color:var(--ok);font-size:14px}
.adminbtn{background:transparent;border:1px solid rgba(255,255,255,.25);color:inherit;border-radius:8px;padding:7px 10px;cursor:pointer;font:inherit;font-size:12.5px;text-align:right;margin-top:auto}
.adminbtn:hover{background:rgba(255,255,255,.06)}
.adminbtn:focus-visible{outline:2px solid var(--rail-mark);outline-offset:1px}
.adminbtn+.live{margin-top:0}
.nav a.nav-admin{margin-top:8px;border:1px dashed rgba(255,255,255,.3)}
.coords{font-size:12px;color:var(--muted)}
.coords a,td a{color:var(--accent)}
.coordbox{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--sunk);border-radius:10px;padding:12px}
.coordbox .ttl{grid-column:1/-1;font-family:var(--f-display);color:var(--accent)}
.coordbox .full{grid-column:1/-1}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.labels .full{grid-column:1/-1}
.labels textarea{resize:vertical}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:50;max-width:calc(100vw - 32px)}
.muted{color:var(--muted)}
.section-head{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between}
.section-head h1{font-size:22px}
.section-head p{margin:2px 0 0;color:var(--muted);font-size:13px;max-width:62ch}
/* responsive */
@media (max-width:980px){.grid2{grid-template-columns:1fr}}
@media (max-width:820px){
  .adminbtn{margin-top:0;white-space:nowrap}
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:5;padding-block:10px;flex-direction:row;align-items:center;gap:12px;overflow-x:auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rail)}
  .brand small,.live{display:none}
  .nav{flex-direction:row}
  .nav a{white-space:nowrap;padding:7px 10px}
  .nav .count{display:none}
  .quick{grid-template-columns:1fr 1fr}
  .quick .name{grid-column:1/-1}
  .search input{width:100%}
  .search{flex:1 1 200px}
}
@media (max-width:560px){
  .dlg-b{grid-template-columns:1fr}
  .report{grid-template-columns:1fr 1fr}
  .inline-add{grid-template-columns:1fr 1fr}
  .barrow{grid-template-columns:90px minmax(0,1fr) 56px}
}
@media (prefers-reduced-motion:no-preference){.nav a,.btn,tr.click td{transition:background-color .15s,border-color .15s}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#005EB8"/><circle cx="17" cy="17" r="3.2" fill="#ffffff"/><path d="M10.5 10.5a9.2 9.2 0 0 0 0 13M23.5 10.5a9.2 9.2 0 0 1 0 13M7 7a14 14 0 0 0 0 20M27 7a14 14 0 0 1 0 20" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      <div><b id="brandName">عمليات Outreach</b><small id="brandSub">متابعة الزيارات الميدانية</small></div>
    </div>

function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
function errMsg(e){
  if(e&&e.code==="invalid_argument"){S.readOnly=true;return "لا تملك صلاحية التعديل على هذه البيانات."}
  if(e&&e.code==="quota_exceeded")return "امتلأت سعة قاعدة البيانات. احذف عمليات قديمة ثم حاول مجدداً.";
  return "تعذّر الحفظ الآن. تحقق من الاتصال وحاول مرة أخرى."}

/* ---------- data layer ---------- */
const LS="outreach-local-v1";
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS)||"{}");S.ops=d.ops||[];S.staff=d.staff||[]}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({ops:S.ops,staff:S.staff}))}catch(e){}}
async function put(col,id,data){
  if(db){try{await db.collection(col).doc(id).set(data);return true}catch(e){toast(errMsg(e));render();return false}}
  const arr=S[col];const i=arr.findIndex(x=>x.id===id);const rec={id,...data};if(i>=0)arr[i]=rec;else arr.push(rec);saveLocal();render();return true}
async function del(col,id){
  if(db){try{await db.collection(col).doc(id).delete();return true}catch(e){toast(errMsg(e));return false}}
  S[col]=S[col].filter(x=>x.id!==id);saveLocal();render();return true}
const newId=p=>p+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

async function boot(){
  let api=null;
  try{if(window.claude&&window.claude.use)api=await window.claude.use("db")}catch(e){}
  if(!api){S.mode="local";loadLocal();
    let fresh=true,cfg=null;try{fresh=!localStorage.getItem(LS);cfg=JSON.parse(localStorage.getItem(LSC)||"null")}catch(e){}
    if((fresh&&!S.ops.length&&!S.staff.length)||!cfg){try{const r=await fetch("data.json",{cache:"no-store"});if(r.ok){const d=await r.json();if(fresh&&!S.ops.length&&!S.staff.length){S.ops=d.ops||[];S.staff=d.staff||[];saveLocal()}if(!cfg&&d.config){cfg=d.config;try{localStorage.setItem(LSC,JSON.stringify(cfg))}catch(e){}}}}catch(e){}}
    S.config=normalizeConfig(cfg);applyConfig();
    try{const h=sessionStorage.getItem("outreach-admin");if(h&&h===S.config.adminHash)S.admin=true}catch(e){}
    S.ready.ops=S.ready.staff=true;setLive();render();return}
  db=api;S.mode="live";setLive();
  try{const u=await window.claude.use("user");if(u){const w=await u.can("data.write");if(w===false)S.readOnly=true}}catch(e){}
  const timer=setTimeout(()=>{if(!S.ready.ops){S.mode="stale";setLive();render()}},10000);
  const sub=(col)=>db.collection(col).onSnapshot(s=>{
      S[col]=s.docs.map(d=>({id:d.id,...d.data()}));
      if(!s.metadata.fromCache){S.ready[col]=true;if(S.mode==="stale"){S.mode="live";setLive()}}
      if(S.ready.ops)clearTimeout(timer);
      render()},
    e=>{clearTimeout(timer);S.mode="error";S.ready[col]=true;setLive();render()});
  sub("ops");sub("staff");
  db.doc("settings/config").onSnapshot(d=>{S.config=normalizeConfig(d.exists?d.data():null);applyConfig();render()},()=>{});
  try{const u=await window.claude.use("user");if(u&&await u.canEdit()){S.admin=true;render()}}catch(e){}
}

async function saveConfig(next){

function parseCoords(s){s=String(s||"").trim();let m=s.match(/@(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/)||s.match(/[?&](?:q|query|ll)=(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/)||s.match(/(-?\d{1,2}\.\d+)\s*[,،\s]\s*(-?\d{1,3}\.\d+)/);return m?{lat:+m[1],lon:+m[2]}:null}

/* ---------- admin session ---------- */
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("outreach:"+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function adminLogin(){
  const dlg=$("#opDlg"),form=$("#opForm");form.onchange=form.oninput=null;
  const setup=!S.config.adminHash;
  form.innerHTML=`<div class="dlg-h"><div><h2>${setup?"إنشاء حساب المشرف":"دخول المشرف"}</h2><span class="muted" style="font-size:12.5px">${setup?"اختر كلمة مرور لصلاحيات الإضافة والتعديل والحذف":"أدخل كلمة مرور المشرف"}</span></div><button type="button" class="btn sm" data-x aria-label="إغلاق">✕</button></div>
  <div class="dlg-b"><div class="field full"><label for="ad-pass">كلمة المرور</label><input id="ad-pass" type="password" autocomplete="${setup?"new-password":"current-password"}" required minlength="6"></div>
  ${setup?`<div class="field full"><label for="ad-pass2">تأكيد كلمة المرور</label><input id="ad-pass2" type="password" autocomplete="new-password" required minlength="6"></div><p class="full muted" style="margin:0;font-size:12.5px">تُحفظ كلمة المرور مشفّرة في إعدادات هذا المتصفح، وتنتقل مع النسخة الاحتياطية.</p>`:""}
  <p class="full" id="ad-err" style="margin:0;color:var(--bad);font-size:13px" hidden></p></div>
  <div class="dlg-f"><span></span><div class="filters"><button type="button" class="btn" data-x>إلغاء</button><button type="submit" class="btn primary">${setup?"إنشاء والدخول":"دخول"}</button></div></div>`;
  form.onclick=e=>{if(e.target.closest("[data-x]"))dlg.close()};
  form.onsubmit=async e=>{e.preventDefault();const p=$("#ad-pass").value,err=$("#ad-err");
    if(p.length<6){err.textContent="كلمة المرور يجب أن تكون 6 أحرف على الأقل.";err.hidden=false;return}
    if(setup){if(p!==$("#ad-pass2").value){err.textContent="كلمتا المرور غير متطابقتين.";err.hidden=false;return}const h=await sha(p);await saveConfig({adminHash:h});enterAdmin(h)}
    else{const h=await sha(p);if(h!==S.config.adminHash){err.textContent="كلمة المرور غير صحيحة.";err.hidden=false;return}enterAdmin(h)}
    dlg.close()};
  dlg.showModal();setTimeout(()=>$("#ad-pass")?.focus(),50)}
function enterAdmin(h){S.admin=true;try{sessionStorage.setItem("outreach-admin",h)}catch(e){}toast("أنت الآن في وضع المشرف");location.hash="admin";render()}

const delBtn=(kind,id)=>S.confirmEnt===kind+":"+id?`<button class="btn sm danger" data-act="ent-del" data-kind="${kind}" data-id="${esc(id)}">تأكيد الحذف</button>`:`<button class="btn sm danger" data-act="ent-ask" data-kind="${kind}" data-id="${esc(id)}">حذف</button>`;

function editEntity(kind,id){
  const dlg=$("#opDlg"),form=$("#opForm");form.onchange=form.oninput=null;
  const isNew=!id,list=kind==="clinic"?CLINICS:POINTS;
  const r=isNew?(kind==="clinic"?{id:"CLN-"+Date.now().toString(36).toUpperCase(),ar:"",en:"",area:"",mgr:"",phone:"",frame:"",c:"#005EB8"}:{id:"LOC-"+Date.now().toString(36).toUpperCase(),ar:"",en:"",addr:"",clinic:CLINICS[0]?.id||"",type:"Camp",visits:0,lat:"",lon:""}):{...list.find(x=>x.id===id)};
  const f=(k,l,v,attrs="")=>`<div class="field"><label for="e-${k}">${l}</label><input id="e-${k}" value="${esc(v??"")}" ${attrs}></div>`;
  const body=kind==="clinic"?`${f("ar","اسم العيادة *",r.ar,"required")}${f("en","الاسم بالإنجليزية",r.en,'dir="ltr"')}${f("area","المنطقة",r.area)}${f("mgr","مدير العيادة",r.mgr)}${f("phone","هاتف الاتصال",r.phone,'type="tel" dir="ltr"')}${f("frame","لون الإطار (اسم)",r.frame,'placeholder="مثال: أزرق"')}
     <div class="field"><label for="e-c">لون العيادة على الموقع</label><input id="e-c" type="color" value="${esc(hexOf(r.c))}" style="height:38px;padding:3px"></div>`
   :`${f("ar","اسم النقطة *",r.ar,"required")}${f("en","الاسم بالإنجليزية",r.en,'dir="ltr"')}
     <div class="field full"><label for="e-addr">العنوان</label><input id="e-addr" value="${esc(r.addr||"")}"></div>
     <div class="field"><label for="e-clinic">العيادة المشرفة</label><select id="e-clinic">${clinicOpts(r.clinic)}</select></div>
     <div class="field"><label for="e-type">نوع الموقع</label><select id="e-type">${opts(Object.entries(PT_TYPES),r.type)}</select></div>
     <div class="coordbox full"><div class="ttl">الإحداثيات</div>
       ${f("lat","خط العرض (Latitude)",r.lat,'dir="ltr" inputmode="decimal" placeholder="31.4190"')}${f("lon","خط الطول (Longitude)",r.lon,'dir="ltr" inputmode="decimal" placeholder="34.3313"')}
       <div class="field full"><label for="e-paste">أو الصق رابط خرائط Google أو الإحداثيات معاً</label><input id="e-paste" dir="ltr" placeholder="https://maps.google.com/...@31.419,34.331  أو  31.419, 34.331"></div>
       <div class="full filters"><button type="button" class="btn sm" data-geo>استخدام موقعي الحالي</button><a id="e-map" class="linkbtn" target="_blank" rel="noopener" ${r.lat!==""&&r.lat!=null?`href="${mapsUrl(r.lat,r.lon)}"`:"hidden"}>فتح في خرائط Google ←</a></div></div>
     ${f("visits","زيارات سابقة (قبل النظام)",r.visits,'type="number" min="0"')}`;
  form.innerHTML=`<div class="dlg-h"><div><h2>${isNew?(kind==="clinic"?"إضافة عيادة":"إضافة نقطة"):"تعديل "+esc(r.ar)}</h2><span class="muted mono" style="font-size:12px">${esc(r.id)}</span></div><button type="button" class="btn sm" data-x aria-label="إغلاق">✕</button></div>
  <div class="dlg-b">${body}</div>
  <div class="dlg-f"><span></span><div class="filters"><button type="button" class="btn" data-x>إلغاء</button><button type="submit" class="btn primary">${isNew?"إضافة":"حفظ"}</button></div></div>`;
  const syncMap=()=>{const a=$("#e-map");if(!a)return;const la=parseFloat($("#e-lat").value),lo=parseFloat($("#e-lon").value);if(isFinite(la)&&isFinite(lo)){a.href=mapsUrl(la,lo);a.hidden=false}else a.hidden=true};
  form.oninput=e=>{if(e.target.id==="e-paste"){const c=parseCoords(e.target.value);if(c){$("#e-lat").value=c.lat;$("#e-lon").value=c.lon;syncMap()}}if(e.target.id==="e-lat"||e.target.id==="e-lon")syncMap()};
  form.onclick=e=>{if(e.target.closest("[data-x]")){dlg.close();return}
    if(e.target.closest("[data-geo]")){if(!navigator.geolocation){toast("المتصفح لا يدعم تحديد الموقع.");return}
      toast("جارٍ تحديد موقعك…");navigator.geolocation.getCurrentPosition(p=>{$("#e-lat").value=p.coords.latitude.toFixed(6);$("#e-lon").value=p.coords.longitude.toFixed(6);syncMap();toast("تم إدخال موقعك الحالي")},()=>toast("تعذّر تحديد الموقع. اسمح للمتصفح بالوصول للموقع أو أدخل الإحداثيات يدوياً."),{enableHighAccuracy:true,timeout:15000})}};
  form.onsubmit=async e=>{e.preventDefault();const g=k=>($("#e-"+k)?.value??"").trim();
    if(!g("ar")){$("#e-ar").focus();return}
    let rec;
    if(kind==="clinic")rec={...r,ar:g("ar"),en:g("en"),area:g("area"),mgr:g("mgr"),phone:g("phone"),frame:g("frame"),c:g("c")||"#005EB8"};
    else{const la=g("lat"),lo=g("lon");const lat=la===""?"":parseFloat(la),lon=lo===""?"":parseFloat(lo);
      if((la!==""&&!(lat>=-90&&lat<=90))||(lo!==""&&!(lon>=-180&&lon<=180))){toast("الإحداثيات غير صحيحة. خط العرض بين -90 و90، وخط الطول بين -180 و180.");return}
      if((la==="")!==(lo==="")){toast("أدخل خط العرض وخط الطول معاً.");return}
      rec={...r,ar:g("ar"),en:g("en"),addr:g("addr"),clinic:g("clinic"),type:g("type"),visits:Math.max(0,parseInt(g("visits"),10)||0),lat,lon};
      if(lat!==""&&!(lat>31.2&&lat<31.65&&lon>34.15&&lon<34.6))toast("تنبيه: الإحداثيات خارج قطاع غزة، تأكد منها.")}
    const arr=list.slice();const i=arr.findIndex(x=>x.id===rec.id);if(i>=0)arr[i]=rec;else arr.push(rec);
    if(await saveConfig(kind==="clinic"?{clinics:arr}:{points:arr})){dlg.close();toast(isNew?"أُضيفت "+rec.ar:"حُفظت "+rec.ar)}};
  dlg.showModal()}
async function deleteEntity(kind,id){
  S.confirmEnt=null;
  if(kind==="clinic"){if(POINTS.some(p=>p.clinic===id)){toast("انقل نقاط هذه العيادة لعيادة أخرى أولاً، ثم احذفها.");render();return}
    if(CLINICS.length<=1){toast("يجب أن تبقى عيادة واحدة على الأقل.");render();return}
    if(await saveConfig({clinics:CLINICS.filter(c=>c.id!==id)}))toast("حُذفت العيادة")}
  else{const used=S.ops.filter(o=>o.point===id).length;if(await saveConfig({points:POINTS.filter(p=>p.id!==id)}))toast(used?`حُذفت النقطة. ${used} عملية سابقة ستظهر بدون اسم مكان.`:"حُذفت النقطة")}}

/* ---------- derived ---------- */
function inRange(o,r){if(r==="all")return true;if(r==="today")return o.date===todayISO();const w=weekDates(0);return o.date>=iso(w[0])&&o.date<=iso(w[6])}
function matchQ(o,q){if(!q)return true;q=q.trim();const hay=[o.code,clinic(o.clinic).ar,point(o.point).ar,point(o.point).en,(o.team||[]).map(t=>t.name).join(" "),o.notes].join(" ").toLowerCase();return hay.includes(q.toLowerCase())}
const sortOps=a=>[...a].sort((x,y)=>(x.date+x.dep).localeCompare(y.date+y.dep));
function late(o){return o.date===todayISO()&&["Planned","Ready"].includes(o.status)&&o.dep&&o.dep<nowHM()}
const rep=o=>o.report||{};

const VIEWS=[["overview","نظرة عامة"],["ops","العمليات"],["week","الخطة الأسبوعية"],["clinics","العيادات"],["points","النقاط والمخيمات"],["staff","الكوادر الميدانية"],["reports","التقارير"]];
const cur=()=>{const h=location.hash.slice(1);return h==="admin"||VIEWS.some(v=>v[0]===h)?h:"overview"};
function renderNav(){

  const ab=$("#adminBtn");if(ab){ab.hidden=S.mode!=="local"&&!S.admin;ab.textContent=S.admin?(S.mode==="local"?"خروج من وضع المشرف":"وضع المشرف مفعّل"):"دخول المشرف"}}

function opts(list,sel,all){return (all?`<option value="">${all}</option>`:"")+list.map(([v,l])=>`<option value="${esc(v)}" ${v===sel?"selected":""}>${esc(l)}</option>`).join("")}

const plural=n=>n===1?"فرد واحد":n===2?"فردان":n<=10?n+" أفراد":n+" فرداً";
const teamTxt=o=>{const t=o.team||[];if(!t.length)return '<span class="muted">لم يُحدد</span>';const lead=t.find(x=>x.id===o.leader);if(!lead)return `<span class="muted">بدون Focal Point</span><span class="sub">${plural(t.length)}</span>`;const ph=lead.phone||(S.staff.find(s=>s.id===lead.id)||{}).phone;return `${esc(lead.name)} <span class="fp" title="Focal Point"><svg class="fpi" width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.4" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="7" cy="7" r="2.2" fill="currentColor"/></svg></span><span class="sub">${ph?`<span class="mono">${esc(ph)}</span> · `:""}${plural(t.length)}</span>`};

function mapSVG(pts){
  const W=640,H=380,m=36;const g=POINTS.filter(p=>p.lat!==""&&p.lat!=null&&isFinite(+p.lat)&&isFinite(+p.lon));pts=pts.filter(p=>g.includes(p));
  const lats=g.map(p=>+p.lat),lons=g.map(p=>+p.lon);let la=[Math.min(31.355,...lats)-.008,Math.max(31.54,...lats)+.008],lo=[Math.min(34.265,...lons)-.008,Math.max(34.45,...lons)+.008];
  const x=v=>m+(v-lo[0])/(lo[1]-lo[0])*(W-2*m),y=v=>H-m-(v-la[0])/(la[1]-la[0])*(H-2*m);
  const grid=[0.2,0.4,0.6,0.8].map(t=>+(la[0]+t*(la[1]-la[0])).toFixed(2)).map(v=>`<line x1="${m}" x2="${W-m}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${W-m+4}" y="${y(v)+4}" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v.toFixed(2)}°N</text>`).join("");
  const labels=[["غزة",31.52,34.415],["دير البلح",31.405,34.335],["النصيرات",31.468,34.37],["خانيونس المواصي",31.352,34.285]].map(([t,a,b])=>`<text x="${x(b)}" y="${y(a)}" font-size="12" fill="var(--muted)" font-family="IBM Plex Sans Arabic,sans-serif" text-anchor="middle">${t}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="مواقع النقاط حسب الإحداثيات">${grid}${labels}
   <text x="${m}" y="${m-12}" font-size="11" fill="var(--muted)" font-family="IBM Plex Sans Arabic,sans-serif">↑ شمال · الغرب يسار (جهة البحر)</text>
   ${pts.map(p=>`<circle cx="${x(+p.lon).toFixed(1)}" cy="${y(+p.lat).toFixed(1)}" r="${4+p.visits/8}" fill="${cv(clinic(p.clinic).c)}" fill-opacity=".75" stroke="var(--surface)" stroke-width="1.5"><title>${esc(p.ar)} · ${p.visits} زيارة</title></circle>`).join("")}</svg>`}

async function saveFile(name,blob){
  let dl=null;try{dl=window.claude&&await window.claude.use("downloads")}catch(e){}
  if(dl){try{await dl.save({filename:name,data:blob});return true}catch(e){if(e&&e.code==="declined")return false}}

      if(d.config&&S.admin){await saveConfig(d.config);n++}
      toast(`استُعيد ${n} سجل من النسخة الاحتياطية`)}catch(err){toast("الملف غير صالح. اختر ملف نسخة احتياطية بصيغة JSON من هذا النظام.")}t.value="";return}
  if(t.dataset.f){S.f[t.dataset.f]=t.value;render();return}
  if(t.dataset.status){const o=S.ops.find(x=>x.id===t.dataset.status);if(!o)return;
    if(t.value==="Completed"){const copy={...o,status:"Completed"};t.value=o.status;openOp(copy);return}
    const {id,...body}=o;await put("ops",id,{...body,status:t.value,updatedAt:new Date().toISOString()});toast(`${o.code}: ${ST[t.value]}`)}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.f.q=e.target.value;clearTimeout(render.t);render.t=setTimeout(render,180)}});
document.addEventListener("submit",async e=>{
  if(e.target.id==="labelsForm"){e.preventDefault();const labels={};e.target.querySelectorAll("[data-lb]").forEach(i=>{if(i.value.trim())labels[i.dataset.lb]=i.value.trim()});if(await saveConfig({labels}))toast("حُفظت العناوين");return}
  if(e.target.id!=="staffForm")return;e.preventDefault();
  const name=$("#sf-name").value.trim();if(!name)return;
  const id=S.editStaff||newId("st");
  if(await put("staff",id,{name,role:$("#sf-role").value,clinic:$("#sf-clinic").value,phone:$("#sf-phone").value.trim()})){toast(S.editStaff?"حُفظ "+name:"أُضيف "+name);S.editStaff=null;render();$("#sf-name")?.focus()}
});
addEventListener("hashchange",()=>{window.scrollTo(0,0);render()});
setInterval(()=>{if(cur()==="overview"&&!document.querySelector("dialog[open]")&&document.activeElement?.id!=="q")render()},60000);
S.config=normalizeConfig(null);applyConfig();render();boot();
</script>

</body>
</html>
